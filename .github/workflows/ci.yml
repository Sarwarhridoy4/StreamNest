name: CI

on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        pip install uv
        uv pip install -e .[test,dev]

    - name: Lint with Ruff
      run: ruff check .

    - name: Typecheck with MyPy
      run: mypy .

    - name: Run tests
      run: pytest