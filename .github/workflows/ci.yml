name: CI

on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        pip install uv
        uv pip install --system -e .[test,dev]

  build-packages:
    name: Build .deb + .AppImage
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          clang cmake ninja-build pkg-config g++ \
          desktop-file-utils dpkg-dev imagemagick libgtk-3-dev lld-20 libfuse2

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install Python dependencies
      run: |
        pip install uv
        uv pip install --system -e .

    - name: Make build script executable
      run: chmod +x scripts/build_linux_packages.sh

    - name: Build .deb and .AppImage packages
      run: ./scripts/build_linux_packages.sh 2.0.2 amd64

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: streamnest-deb
        path: dist/*.deb
        retention-days: 7

    - name: Upload .AppImage artifact
      uses: actions/upload-artifact@v4
      with:
        name: streamnest-appimage
        path: dist/*.AppImage
        retention-days: 7