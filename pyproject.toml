[project]
name = "streamnest"
version = "2.0.2"
description = "StreamNest media downloader built with Flet and yt-dlp."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet[all]>=0.82.0,<1.0.0",
    "yt-dlp>=2026.3.10,<2027.0.0",
    "cryptography>=45.0.0,<51.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = ["S101", "S104", "COM812", "ISC001"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[tool.flet]
org = "com.sarwarhridoy4"
product = "StreamNest"
company = "Sarwar Hossain"

[tool.flet.app]
path = "."
module = "main"

[tool.flet.android]
split_per_abi = true

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
"android.permission.READ_MEDIA_VIDEO" = true
"android.permission.READ_MEDIA_AUDIO" = true

# ✅ ADD THIS PART
[tool.setuptools.packages.find]
where = ["."]
include = ["ui*", "state*", "services*"]
exclude = ["assets*"]
